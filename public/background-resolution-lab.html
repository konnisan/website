<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konni 桌面背景比例检查</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px 22px; overflow: hidden; color: #273b3e; background: #dfe8e5; font-family: "Microsoft YaHei", sans-serif; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 5px 0 14px; color: #65777a; font-size: 12px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      article { min-width: 0; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.76); box-shadow: 0 12px 32px rgba(46,72,75,.12); }
      header { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 12px; }
      header span { color: #6f8184; }
      .viewport { position: relative; width: 100%; overflow: hidden; border-radius: 10px; background: #bac9c6; }
      iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: left top; }
      .wide .viewport { aspect-ratio: 16 / 9; }
      .sixteen-ten .viewport { aspect-ratio: 16 / 10; }
      .square .viewport { aspect-ratio: 5 / 4; }
      .ultrawide .viewport { aspect-ratio: 21 / 9; }
      .wide iframe { width: 1920px; height: 1080px; transform: scale(.326); }
      .sixteen-ten iframe { width: 1440px; height: 900px; transform: scale(.435); }
      .square iframe { width: 1280px; height: 1024px; transform: scale(.489); }
      .ultrawide iframe { width: 2560px; height: 1080px; transform: scale(.2445); }
    </style>
  </head>
  <body>
    <h1>同一套组件、同一张背景，只改变桌面宽高比</h1>
    <p>检查城堡焦点是否保留、边缘装饰如何被裁切，以及背景处理是否干扰现有组件。</p>
    <main>
      <article class="wide"><header><strong>标准桌面</strong><span>1920 × 1080 · 16:9</span></header><div class="viewport"><iframe src="/background-prototype.html" title="16比9背景预览"></iframe></div></article>
      <article class="sixteen-ten"><header><strong>常见笔记本</strong><span>1440 × 900 · 16:10</span></header><div class="viewport"><iframe src="/background-prototype.html" title="16比10背景预览"></iframe></div></article>
      <article class="square"><header><strong>偏方桌面</strong><span>1280 × 1024 · 5:4</span></header><div class="viewport"><iframe src="/background-prototype.html" title="5比4背景预览"></iframe></div></article>
      <article class="ultrawide"><header><strong>超宽桌面</strong><span>2560 × 1080 · 21:9</span></header><div class="viewport"><iframe src="/background-prototype.html" title="21比9背景预览"></iframe></div></article>
    </main>
  </body>
</html>
